<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Treading Delivery Services</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #08090d;
  color: white;
}

/* HEADER */
header {
  background: #08090d;
  border-bottom: 3px solid #8b2be2;
  padding: 16px 5%;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  font-size: 38px;
}

.logo-name {
  color: #a23cff;
  font-size: 24px;
  font-weight: 900;
  line-height: .9;
}

.logo-sub {
  font-size: 11px;
  font-weight: bold;
}

.tagline {
  font-style: italic;
  font-weight: bold;
  font-size: 13px;
}

.phone {
  font-size: 17px;
  font-weight: bold;
}

nav {
  margin-top: 15px;
  text-align: right;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  font-size: 14px;
}

nav a:hover {
  color: #a23cff;
}

/* HERO */
.hero {
  min-height: 500px;
  display: flex;
  align-items: center;
  padding: 55px 6%;
  background:
    radial-gradient(circle at 80% 35%, #5b146d 0%, transparent 35%),
    linear-gradient(120deg,#08090d,#151020,#090a0f);
}

.hero-content {
  max-width: 720px;
}

.hero h1 {
  font-size: clamp(48px,8vw,82px);
  line-height: .95;
  margin: 0;
  font-weight: 900;
  font-style: italic;
}

.purple {
  color: #a83cff;
}

.hero p {
  font-size: 20px;
  font-weight: bold;
  margin: 25px 0;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.btn {
  display: inline-block;
  padding: 17px 25px;
  border-radius: 8px;
  font-weight: 900;
  text-decoration: none;
  text-align: center;
  border: 2px solid white;
}

.btn-purple {
  background: #8b24d4;
  color: white;
  border-color: #8b24d4;
}

.btn
